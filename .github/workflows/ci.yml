name: ci

# Pull-request gate. `ci-ok` is the only check to mark as required on main:
# it stays green when nothing changed (skipped jobs) and is red on any
# failed or cancelled job. No paths filter, so the check always reports.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  # BuildKit builds the images, so it is pinned like every other input.
  # Renovate keeps tag and digest current (custom manager in renovate.json5).
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # workflow_dispatch has no base branch: compare against the default one.
      - name: Affected images
        id: matrix
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          matrix=$(go run ./tools/nimgctl changed "origin/${BASE_REF}")
          echo "$matrix"
          echo "images=$(jq -c '[.include[].image] | unique' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: shellcheck
        run: shellcheck -x lib/*.sh images/*/test.sh

      - name: rescan stub tests
        run: lib/rescan_test.sh

  # Renovate automerges distroless base updates: this cosign keyless check of
  # every distroless digest (Google's signing identity) is what gates them.
  verify-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify distroless signatures
        run: go run ./tools/nimgctl verify-base --all

  images:
    needs: [changes, unit]
    # An empty matrix is an error in GitHub Actions: skip when nothing changed.
    if: needs.changes.outputs.images != '[]'
    name: ${{ matrix.image }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build nimgctl
        run: go build -o "$RUNNER_TEMP/nimgctl" ./tools/nimgctl

      # No QEMU: each arch builds and tests natively on its own runner.
      - name: Build, test, scan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          nimgctl="$RUNNER_TEMP/nimgctl"
          "$nimgctl" build "$IMAGE"
          "$nimgctl" test "$IMAGE"
          "$nimgctl" scan "$IMAGE"

  ci-ok:
    if: always()
    needs: [changes, unit, verify-base, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # skipped is fine (nothing changed); failure and cancelled are not.
      - name: Check needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'any(.[]; .result == "failure" or .result == "cancelled") | not' <<<"$NEEDS" >/dev/null
